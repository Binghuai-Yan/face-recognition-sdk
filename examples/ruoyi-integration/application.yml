facesdk:
  api-url: ${FACESDK_API_URL:http://localhost:8000}
  detection-api-key: ${FACESDK_DETECTION_API_KEY}
  recognition-api-key: ${FACESDK_RECOGNITION_API_KEY}
  verification-api-key: ${FACESDK_VERIFICATION_API_KEY}
  similarity-threshold: 0.8
  connect-timeout: 5000
  read-timeout: 30000
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
