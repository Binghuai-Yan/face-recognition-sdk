# CompreFace 1.2 includes API, admin, Core and UI. PostgreSQL is external.
services:
  compreface-api:
    image: exadel/compreface:1.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EXTERNAL_DB: "true"
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-compreface}
      POSTGRES_USER: ${POSTGRES_USER:-compreface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-10MB}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5MB}
      UWSGI_PROCESSES: ${WORKERS:-2}
      UWSGI_THREADS: ${THREADS:-1}
      SAVE_IMAGES_TO_DB: "false"
    networks: [facesdk-network]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/consistence/status | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get(\"status\") == \"OK\" else 1)'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-4}'
          memory: ${MEMORY_LIMIT:-8G}

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compreface}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-compreface}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks: [facesdk-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # TLS gateway. Supply nginx/ssl/fullchain.pem and privkey.pem before enabling.
  nginx:
    image: nginx:1.26-alpine
    profiles: [gateway]
    restart: unless-stopped
    depends_on:
      oss-gateway:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    networks: [facesdk-network]

  # CompreFace uses its built-in cache; this store is for application integrations.
  redis:
    image: redis:7-alpine
    profiles: [cache]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "test -n \"$$REDIS_PASSWORD\" && exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 512mb --maxmemory-policy allkeys-lru"]
    volumes: [redis-data:/data]
    networks: [facesdk-network]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Default S3-compatible object store. External providers are configured on oss-gateway.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    entrypoint: ["sh", "-c", "test -n \"$$RUSTFS_ACCESS_KEY\" && test -n \"$$RUSTFS_SECRET_KEY\" && exec /entrypoint.sh \"$$@\"", "--"]
    command: ["rustfs"]
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-facesdk}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-${OSS_SECRET_ACCESS_KEY:-}}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes: [rustfs-data:/data, rustfs-logs:/logs]
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [facesdk-network]

  oss-gateway:
    image: facesdk/oss-gateway:1.0.0
    build: ../services/oss-gateway
    restart: unless-stopped
    depends_on:
      compreface-api:
        condition: service_healthy
    environment:
      COMPREFACE_UPSTREAM: http://compreface-api:80
      OSS_PROVIDER: s3
      OSS_ENDPOINT: ${OSS_ENDPOINT:-http://rustfs:9000}
      OSS_BUCKET: ${OSS_BUCKET:-facesdk-images}
      OSS_REGION: ${OSS_REGION:-us-east-1}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:-facesdk}}
      OSS_SECRET_ACCESS_KEY: ${OSS_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:-}}
      OSS_SESSION_TOKEN: ${OSS_SESSION_TOKEN:-}
      OSS_ADDRESSING_STYLE: ${OSS_ADDRESSING_STYLE:-path}
      OSS_AUTO_CREATE_BUCKET: ${OSS_AUTO_CREATE_BUCKET:-true}
      OSS_PREFIX: ${OSS_PREFIX:-faces}
      OSS_CA_BUNDLE: ${OSS_CA_BUNDLE:-}
      OSS_MAX_BODY_BYTES: ${OSS_MAX_BODY_BYTES:-10485760}
      OSS_JOURNAL_PATH: /data/storage.sqlite3
    volumes: [oss-journal:/data]
    ports:
      - "${COMPREFACE_BIND_ADDRESS:-127.0.0.1}:${COMPREFACE_PORT:-8000}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/consistence/status', timeout=10)"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks: [facesdk-network]

  prometheus:
    image: prom/prometheus:v2.48.0
    profiles: [monitoring]
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [blackbox-exporter, postgres-exporter, alertmanager]
    networks: [facesdk-network]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    profiles: [monitoring]
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [facesdk-network]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [monitoring]
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-compreface}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-compreface}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks: [facesdk-network]
    depends_on:
      postgres:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    networks: [facesdk-network]

  grafana:
    image: grafana/grafana:10.2.3
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/facesdk.json:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    networks: [facesdk-network]

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rustfs-logs:
  oss-journal:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  facesdk-network:
    driver: bridge
