events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=10s;
    # Legacy static image URLs contain service API keys.
    map $uri $log_request { default 1; ~^/api/v1/static/ 0; }
    access_log /var/log/nginx/access.log combined if=$log_request;
    map $http_x_api_key $limit_key { default $http_x_api_key; "" $binary_remote_addr; }
    limit_req_zone $limit_key zone=api_limit:10m rate=10r/s;
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        set $oss_backend oss-gateway:8080;
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10m;
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://$oss_backend;
        }
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_pass http://$oss_backend;
        }
    }
}
