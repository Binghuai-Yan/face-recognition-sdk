# FaceSDK 测试环境 Docker Compose 配置
# CompreFace 自带 PostgreSQL，这里只启动 CompreFace 容器

services:
  # CompreFace 完整服务（自带 PostgreSQL、Redis、API、Admin、Core）
  compreface-api:
    image: exadel/compreface:1.2.0
    container_name: facesdk-compreface-api
    restart: unless-stopped
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  compreface-data:

networks:
  default:
    name: facesdk-network
