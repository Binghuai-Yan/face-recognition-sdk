# FaceSDK 测试环境 Docker Compose 配置
# Standalone test deployment with the image's internal PostgreSQL.

services:
  # CompreFace 完整服务（自带 PostgreSQL、Redis、API、Admin、Core）
  compreface-api:
    image: exadel/compreface:1.2.0
    container_name: facesdk-compreface-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COMPREFACE_TEST_PORT:-8000}:80"
    volumes:
      - compreface-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/consistence/status | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get(\"status\") == \"OK\" else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  compreface-test-data:

networks:
  default:
