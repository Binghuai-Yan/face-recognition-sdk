global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alert_rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: facesdk-health
    metrics_path: /probe
    params:
      module: [compreface_health]
    static_configs:
      - targets: ['http://compreface-api:8080/api/v1/consistence/status']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
