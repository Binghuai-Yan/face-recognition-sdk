groups:
  - name: facesdk
    rules:
      - alert: FaceSDKAPIDown
        expr: probe_success{job="facesdk-health"} == 0 or up{job="facesdk-health"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "CompreFace API, database or core is unavailable"}
      - alert: PostgreSQLDown
        expr: pg_up{job="postgres"} == 0 or up{job="postgres"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "PostgreSQL or its exporter is unavailable"}
