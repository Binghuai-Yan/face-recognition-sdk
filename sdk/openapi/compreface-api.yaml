openapi: 3.0.3
info:
  title: CompreFace 1.2 — FaceSDK supported endpoints
  version: 1.2.0
  description: Wire protocol for the endpoints used by this repository; not the full
    CompreFace administration API. SDK faces/results/is_match/threshold are client
    normalization fields. Feature extraction uses detection with face_plugins=calculator;
    similarity thresholds are applied by clients. CompreFace persists neither separate
    subject names nor arbitrary metadata.
servers:
- url: http://localhost:8000
security:
- ServiceKey: []
paths:
  /api/v1/detection/detect:
    post:
      summary: Detect faces
      description: Requires a Detection service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detection'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      parameters:
      - &id001
        name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Maximum detected faces; zero means no limit.
      - &id002
        name: det_prob_threshold
        in: query
        required: false
        schema:
          type: number
      - &id003
        name: face_plugins
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated age, gender, pose, landmarks, calculator or mask;
          availability depends on the model.
      - &id004
        name: status
        in: query
        required: false
        schema:
          type: boolean
  /api/v1/verification/verify:
    post:
      summary: Compare source against target faces
      description: Requires a Verification service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                source_image:
                  type: string
                  format: binary
                target_image:
                  type: string
                  format: binary
              required:
              - source_image
              - target_image
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
  /api/v1/recognition/recognize:
    post:
      summary: Find subject candidates per detected face
      description: Requires a Recognition service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recognition'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - name: prediction_count
        in: query
        required: false
        schema:
          type: integer
        description: Maximum subject predictions per face; default 1.
  /api/v1/recognition/subjects:
    get:
      summary: List subject names
      description: Requires a Recognition service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subjects'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a subject
      description: Requires a Recognition service API key.
      responses:
        '200': &id005
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201': *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subject'
  /api/v1/recognition/subjects/{subject}:
    delete:
      summary: Delete a subject and its examples
      description: Requires a Recognition service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subject
        in: path
        required: true
        schema:
          type: string
  /api/v1/recognition/faces:
    post:
      summary: Add a face example; creates subject if needed
      description: Requires a Recognition service API key.
      responses:
        '200': &id006
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRecord'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201': *id006
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      parameters:
      - name: subject
        in: query
        required: true
        schema:
          type: string
    get:
      summary: Page through face examples
      description: Requires a Recognition service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacePage'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subject
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: size
        in: query
        required: false
        schema:
          type: integer
  /api/v1/recognition/faces/{image_id}:
    delete:
      summary: Delete a face example
      description: Requires a Recognition service API key.
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRecord'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: image_id
        in: path
        required: true
        schema:
          type: string
  /api/v1/consistence/status:
    get:
      summary: Check API, database and core consistency
      security: []
      responses:
        '200':
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: Successful CompreFace response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Create separate Detection, Recognition and Verification services
        in the UI and use the matching key.
  schemas:
    Box:
      type: object
      properties:
        x_min:
          type: integer
        y_min:
          type: integer
        x_max:
          type: integer
        y_max:
          type: integer
        probability: &id008
          type: number
          minimum: 0
          maximum: 1
    Face:
      type: object
      properties:
        box:
          $ref: '#/components/schemas/Box'
        landmarks:
          type: array
          items:
            type: array
            items: &id007
              type: number
        embedding:
          type: array
          items: *id007
        age:
          type: object
          properties:
            low: *id007
            high: *id007
            probability: *id007
        gender:
          type: object
          properties:
            value:
              type: string
            probability: *id007
        pose:
          type: object
          properties:
            pitch: *id007
            yaw: *id007
            roll: *id007
      required:
      - box
    Detection:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/Face'
      required:
      - result
    Candidate:
      type: object
      properties:
        subject:
          type: string
        similarity: *id008
      required:
      - subject
      - similarity
    RecognitionFace:
      allOf:
      - $ref: '#/components/schemas/Face'
      - type: object
        properties:
          subjects:
            type: array
            items:
              $ref: '#/components/schemas/Candidate'
        required:
        - subjects
    Recognition:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: '#/components/schemas/RecognitionFace'
      required:
      - result
    VerificationFace:
      allOf:
      - $ref: '#/components/schemas/Face'
      - type: object
        properties:
          similarity: *id008
        required:
        - similarity
    Verification:
      type: object
      properties:
        result:
          type: array
          items:
            type: object
            properties:
              source_image_face:
                $ref: '#/components/schemas/Face'
              face_matches:
                type: array
                items:
                  $ref: '#/components/schemas/VerificationFace'
            required:
            - source_image_face
            - face_matches
      required:
      - result
    Subject:
      type: object
      properties:
        subject:
          type: string
      required:
      - subject
    Subjects:
      type: object
      properties:
        subjects:
          type: array
          items:
            type: string
      required:
      - subjects
    FaceRecord:
      type: object
      properties:
        image_id:
          type: string
          format: uuid
        subject:
          type: string
      required:
      - image_id
      - subject
    FacePage:
      type: object
      properties:
        faces:
          type: array
          items:
            $ref: '#/components/schemas/FaceRecord'
        page_number:
          type: integer
          minimum: 0
        page_size:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        total_elements:
          type: integer
          minimum: 0
      required:
      - faces
      - total_elements
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
