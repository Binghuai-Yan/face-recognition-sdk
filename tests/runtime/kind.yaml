kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18082
        listenAddress: 127.0.0.1
      - containerPort: 443
        hostPort: 18445
        listenAddress: 127.0.0.1
