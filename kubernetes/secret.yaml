# Example only: create facesdk-secrets before applying the manifests.
apiVersion: v1
kind: Secret
metadata:
  name: facesdk-secrets
  namespace: facesdk
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_RANDOM_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_SEPARATE_RANDOM_PASSWORD"
  OSS_ACCESS_KEY_ID: "REPLACE_WITH_OBJECT_STORAGE_ACCESS_KEY"
  OSS_SECRET_ACCESS_KEY: "REPLACE_WITH_OBJECT_STORAGE_SECRET"
