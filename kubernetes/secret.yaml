# FaceSDK Secret - 敏感配置
# 注意：生产环境请使用 Vault 或 Sealed Secrets 管理敏感信息

apiVersion: v1
kind: Secret
metadata:
  name: facesdk-secrets
  namespace: facesdk
type: Opaque
stringData:
  # API 密钥
  COMPREFACE_API_KEY: "your-secure-api-key-here"
  
  # PostgreSQL 密码
  POSTGRES_PASSWORD: "your-secure-db-password"
  
  # MinIO 密码
  MINIO_ROOT_PASSWORD: "minioadmin123"
  
  # Grafana 密码
  GRAFANA_ADMIN_PASSWORD: "admin"
