# FaceSDK Ingress Configuration

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: facesdk-ingress
  namespace: facesdk
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - facesdk-api.yourdomain.com
        - facesdk-ui.yourdomain.com
      secretName: facesdk-tls
  rules:
    - host: facesdk-api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compreface-api
                port:
                  number: 80
    - host: facesdk-ui.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: compreface-ui
                port:
                  number: 80
