apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: facesdk-secrets
                  key: OSS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: facesdk-secrets
                  key: OSS_SECRET_ACCESS_KEY
            - name: RUSTFS_CONSOLE_ENABLE
              value: 'false'
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          readinessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /health, port: s3}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '2', memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: rustfs-data}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  type: ClusterIP
  selector: {app: rustfs}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
