# FaceSDK Kustomization Configuration

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: facesdk

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-deployment.yaml
  - compreface-deployment.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/name: facesdk
      app.kubernetes.io/version: "1.0.0"
      app.kubernetes.io/managed-by: kubectl
    includeSelectors: true

images:
  - name: exadel/compreface
    newTag: "1.2.0"
  - name: postgres
    newTag: "15-alpine"

replicas:
  - name: compreface-api
    count: 1
