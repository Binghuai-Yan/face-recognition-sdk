apiVersion: apps/v1
kind: Deployment
metadata:
  name: compreface-api
  namespace: facesdk
  labels:
    app: compreface-api
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compreface-api
  template:
    metadata:
      labels:
        app: compreface-api
        component: api
    spec:
      containers:
      - name: compreface-api
        image: exadel/compreface:1.2.0
        ports:
        - containerPort: 80
          name: http
        env:
        - name: EXTERNAL_DB
          value: 'true'
        - name: POSTGRES_URL
          value: jdbc:postgresql://postgres:5432/compreface
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: facesdk-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: facesdk-secrets
              key: POSTGRES_PASSWORD
        - name: LOGGING_LEVEL_ROOT
          value: INFO
        - name: UWSGI_PROCESSES
          value: '2'
        - name: UWSGI_THREADS
          value: '1'
        - name: SAVE_IMAGES_TO_DB
          value: 'true'
        resources:
          requests:
            memory: 4Gi
            cpu: 2000m
          limits:
            memory: 8Gi
            cpu: 4000m
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: &id001
            - sh
            - -c
            - curl -fsS http://localhost:8080/api/v1/consistence/status | python3
              -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status")
              == "OK" else 1)'
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 3
        startupProbe:
          exec:
            command: *id001
          periodSeconds: 10
          timeoutSeconds: 15
          failureThreshold: 60
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: compreface-api
  namespace: facesdk
  labels:
    app: compreface-api
spec:
  selector:
    app: compreface-api
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: compreface-ui
  namespace: facesdk
spec:
  selector:
    app: compreface-api
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
